# Paste this into Portainer -> Stacks -> Add stack -> Web editor.
# It expects the image "strava-analyzer:latest" to already exist on the Docker host
# (build it with Portainer -> Images -> Build a new image, or `docker build` on the host; see README).
services:
  strava-analyzer:
    image: strava-analyzer:latest
    container_name: strava-analyzer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_STRAVA_CLIENT_ID: "12345"                 # from strava.com/settings/api
      NUXT_STRAVA_CLIENT_SECRET: "your_client_secret" # from strava.com/settings/api
      NUXT_APP_URL: "http://192.168.1.50:3000"        # exact URL you open the dashboard on, no trailing slash
      NUXT_DASHBOARD_PASSWORD: "change-me"           # leave empty to disable the login page
      NUXT_SYNC_INTERVAL_MINUTES: "60"               # auto-sync interval, 0 = manual only
      NUXT_DETAIL_SYNC: "true"                       # slowly download per-activity details (best efforts, calories)
      TZ: "Europe/Paris"
    volumes:
      - strava-data:/data

volumes:
  strava-data:
