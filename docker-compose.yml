# docker compose up -d --build   (or a Portainer stack pointed at this git repo)
services:
  strava-analyzer:
    image: strava-analyzer:latest
    build: .
    container_name: strava-analyzer
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      NUXT_DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      NUXT_SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      NUXT_GARMIN_HEALTH_DAYS: ${GARMIN_HEALTH_DAYS:-365}
      NUXT_IMPORT_DIR: ${IMPORT_DIR_IN_CONTAINER:-}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - strava-data:/data
      # - /srv/garmin-fit:/import:ro   # optional watched folder (also set IMPORT_DIR_IN_CONTAINER=/import)

volumes:
  strava-data:
